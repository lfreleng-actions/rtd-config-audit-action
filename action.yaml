---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# rtd-config-audit-action
name: "📄 Audit ReadTheDocs Configuration"
description: "Check a repository's ReadTheDocs setup for policy compliance"

# Parses .readthedocs.yaml as YAML rather than by pattern matching, so a
# key nested under build.tools.python never gets confused with a
# similarly named key elsewhere in the document.
#
# Every policy input defaults to empty or to the permissive setting. With
# no configuration the action checks what all projects share: that the
# config parses, declares a build image and a documentation Python
# version, and that the version still receives upstream support.

inputs:
  path_prefix:
    description: "Directory location containing project code"
    required: false
    default: "."
  config_file:
    # yamllint disable-line rule:line-length
    description: "Path to the ReadTheDocs config; empty searches for .readthedocs.yaml then .readthedocs.yml"
    required: false
    default: ""
  tox_file:
    # yamllint disable-line rule:line-length
    description: "Path to the tox file holding the docs environment; empty searches docs/tox.ini then tox.ini"
    required: false
    default: ""
  required_files:
    # yamllint disable-line rule:line-length
    description: "Newline or comma separated files the project must ship; empty disables the check"
    required: false
    default: ""
  forbidden_files:
    # yamllint disable-line rule:line-length
    description: "Newline or comma separated files the project must not ship; empty disables the check"
    required: false
    default: ""
  build_os:
    # yamllint disable-line rule:line-length
    description: "Expected build.os value, e.g. ubuntu-24.04; empty accepts whatever the project declares"
    required: false
    default: ""
  python_version:
    # yamllint disable-line rule:line-length
    description: "Expected build.tools.python value; empty accepts any version that upstream still supports"
    required: false
    default: ""
  default_python:
    # yamllint disable-line rule:line-length
    description: "Documentation Python version to assume when the project declares none"
    required: false
    default: "3.13"
  eol_behaviour:
    # yamllint disable-line rule:line-length
    description: "Treatment of an end-of-life Python version: warn, fail or ignore"
    required: false
    default: "warn"
  linkcheck_policy:
    # yamllint disable-line rule:line-length
    description: >-
      Treatment of a linkcheck environment that sets '-W': warn, fail or
      ignore. External sites increasingly block automated requests, so a
      strict link check reports somebody else's bot policy as a build
      failure.
    required: false
    default: "warn"
  require_sphinx_strict:
    # yamllint disable-line rule:line-length
    description: "Expect '-W' on documentation builds (does not apply to linkcheck)"
    required: false
    default: "false"
  fail_on_warning:
    description: "Fail the action when the audit reports warnings"
    required: false
    default: "false"
  offline_mode:
    # yamllint disable-line rule:line-length
    description: "Skip the network lookup of supported Python versions"
    required: false
    default: "false"
  summary:
    description: "Write a report to the workflow step summary"
    required: false
    default: "true"

outputs:
  passed:
    description: "Whether the audit completed without a failing finding"
    value: ${{ steps.audit.outputs.passed }}
  config_found:
    description: "Whether the action located a ReadTheDocs config"
    value: ${{ steps.audit.outputs.config_found }}
  config_path:
    description: "Path of the ReadTheDocs config the action inspected"
    value: ${{ steps.audit.outputs.config_path }}
  tox_path:
    # yamllint disable-line rule:line-length
    description: "Path of the tox file the action inspected; empty when it found none"
    value: ${{ steps.audit.outputs.tox_path }}
  tox_dir:
    # yamllint disable-line rule:line-length
    description: "Directory holding the tox file, suitable for running tox from"
    value: ${{ steps.audit.outputs.tox_dir }}
  docs_python:
    # yamllint disable-line rule:line-length
    description: "Python version the documentation build should use; suitable for setup-python"
    value: ${{ steps.audit.outputs.docs_python }}
  tox_python:
    description: "Python version pinned by the tox docs environment"
    value: ${{ steps.audit.outputs.tox_python }}
  rtd_python:
    description: "Python version declared by build.tools.python"
    value: ${{ steps.audit.outputs.rtd_python }}
  python_mismatch:
    description: "Whether the tox and ReadTheDocs Python versions diverge"
    value: ${{ steps.audit.outputs.python_mismatch }}
  python_eol:
    # yamllint disable-line rule:line-length
    description: "Whether the documentation Python version has reached end of life"
    value: ${{ steps.audit.outputs.python_eol }}
  build_os:
    description: "The build.os value the project declares"
    value: ${{ steps.audit.outputs.build_os }}
  runner:
    # yamllint disable-line rule:line-length
    description: "GitHub-hosted runner label matching build.os; empty when build.os floats, is unsupported or is absent"
    value: ${{ steps.audit.outputs.runner }}
  runner_os:
    # yamllint disable-line rule:line-length
    description: "OS of the runner the audit ran on, as ubuntu-<VERSION_ID>; empty off Ubuntu"
    value: ${{ steps.audit.outputs.runner_os }}
  apt_packages:
    # yamllint disable-line rule:line-length
    description: "Space-separated build.apt_packages, in declared order; invalid names are dropped"
    value: ${{ steps.audit.outputs.apt_packages }}
  build_jobs:
    # yamllint disable-line rule:line-length
    description: "Space-separated build.jobs step names, in declared order"
    value: ${{ steps.audit.outputs.build_jobs }}
  build_commands:
    description: "Whether the configuration declares build.commands"
    value: ${{ steps.audit.outputs.build_commands }}
  errors:
    description: "Count of findings at error severity"
    value: ${{ steps.audit.outputs.errors }}
  warnings:
    description: "Count of findings at warning severity"
    value: ${{ steps.audit.outputs.warnings }}
  findings_json:
    description: "Complete audit report as a JSON string"
    value: ${{ steps.audit.outputs.findings_json }}

runs:
  using: "composite"
  steps:
    # Validate boolean inputs before anything consumes them. The
    # supported-versions step below gates on offline_mode, so a value
    # such as 'True' or 'yes' would otherwise pass silently and run the
    # opposite of what the caller intended.
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_REQUIRE_SPHINX_STRICT: ${{ inputs.require_sphinx_strict }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        INPUT_OFFLINE_MODE: ${{ inputs.offline_mode }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_EOL_BEHAVIOUR: ${{ inputs.eol_behaviour }}
        INPUT_LINKCHECK_POLICY: ${{ inputs.linkcheck_policy }}
      run: |
        # Validate inputs
        set -euo pipefail

        for flag in "$INPUT_REQUIRE_SPHINX_STRICT" "$INPUT_FAIL_ON_WARNING" \
                    "$INPUT_SUMMARY" "$INPUT_OFFLINE_MODE"; do
          if [ "$flag" != "true" ] && [ "$flag" != "false" ]; then
            echo 'Error: boolean inputs accept only true or false ❌'
            exit 1
          fi
        done

        for policy in "$INPUT_EOL_BEHAVIOUR" "$INPUT_LINKCHECK_POLICY"; do
          case "$policy" in
            warn|fail|ignore) ;;
            *)
              echo 'Error: policy inputs accept warn, fail or ignore ❌'
              exit 1
              ;;
          esac
        done

        echo "Inputs validated ✅"

    # Reuse the organisation's release calendar from
    # supported-versions-action rather than carrying a second copy here.
    # A documentation-only repository has no Python metadata; should the
    # action fail on one, continue-on-error leaves the supported set
    # empty and the audit skips the version check.
    - name: "Determine supported Python versions"
      id: supported
      if: inputs.offline_mode != 'true'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/supported-versions-action@03b92a8beb19378d01f3bb473653dfc2c9adc834  # v0.0.1
      continue-on-error: true
      with:
        tool: python
        path_prefix: ${{ inputs.path_prefix }}
        eol_behaviour: "warn"

    # Choose the interpreter here rather than run whichever python3 the
    # caller's PATH finds first. With update-environment off,
    # setup-python reports the interpreter's path and leaves the
    # caller's PATH and environment as they were.
    - name: "Set up Python"
      id: python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"
        update-environment: false

    - name: "Provide PyYAML"
      id: deps
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        # Provide PyYAML
        set -euo pipefail

        # -I keeps the caller's environment, working directory and user
        # site off sys.path, so a yaml.py or pip/ in the caller's
        # workspace is never imported in place of the real module.
        cd "$ACTION_PATH"

        if "$PYTHON" -I -c 'import yaml' 2>/dev/null; then
          echo "PyYAML already present ✅"
          exit 0
        fi

        echo "Installing PyYAML..."
        # Install the version the unit tests run against, hash-checked,
        # so the caller's job never runs whatever PyPI serves on the day.
        # Install into the interpreter setup-python provided, not --user:
        # -I hides the user site. -I does not reach pip's own settings,
        # so --isolated drops the caller's PIP_* variables and the null
        # PIP_CONFIG_FILE skips every pip.conf; otherwise PIP_USER,
        # PIP_TARGET or a config file could put PyYAML where the audit
        # cannot import it. --quiet keeps the log readable.
        if ! PIP_CONFIG_FILE=/dev/null "$PYTHON" -I -m pip install \
            --isolated --disable-pip-version-check --quiet \
            --require-hashes -r "$ACTION_PATH/requirements.txt"; then
          echo 'Error: could not install PyYAML ❌'
          exit 1
        fi
        if ! "$PYTHON" -I -c 'import yaml'; then
          echo 'Error: installed PyYAML is not importable ❌'
          exit 1
        fi
        echo "Installed PyYAML ✅"

    - name: "Audit ReadTheDocs configuration"
      id: audit
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_CONFIG_FILE: ${{ inputs.config_file }}
        INPUT_TOX_FILE: ${{ inputs.tox_file }}
        INPUT_REQUIRED_FILES: ${{ inputs.required_files }}
        INPUT_FORBIDDEN_FILES: ${{ inputs.forbidden_files }}
        INPUT_BUILD_OS: ${{ inputs.build_os }}
        INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        INPUT_DEFAULT_PYTHON: ${{ inputs.default_python }}
        INPUT_EOL_BEHAVIOUR: ${{ inputs.eol_behaviour }}
        INPUT_LINKCHECK_POLICY: ${{ inputs.linkcheck_policy }}
        INPUT_REQUIRE_SPHINX_STRICT: ${{ inputs.require_sphinx_strict }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        INPUT_OFFLINE_MODE: ${{ inputs.offline_mode }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        SUPPORTED_VERSIONS: ${{ steps.supported.outputs.supported_versions }}
        ACTION_PATH: ${{ github.action_path }}
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        # Audit ReadTheDocs configuration
        set -uo pipefail

        args=(
          --config-file "$INPUT_CONFIG_FILE"
          --tox-file "$INPUT_TOX_FILE"
          --required-files "$INPUT_REQUIRED_FILES"
          --forbidden-files "$INPUT_FORBIDDEN_FILES"
          --build-os "$INPUT_BUILD_OS"
          --python-version "$INPUT_PYTHON_VERSION"
          --default-python "$INPUT_DEFAULT_PYTHON"
          --eol-behaviour "$INPUT_EOL_BEHAVIOUR"
          --linkcheck-policy "$INPUT_LINKCHECK_POLICY"
          --supported-versions "${SUPPORTED_VERSIONS:-}"
        )
        if [ "$INPUT_REQUIRE_SPHINX_STRICT" = "true" ]; then
          args+=(--require-sphinx-strict)
        fi
        if [ "$INPUT_FAIL_ON_WARNING" = "true" ]; then
          args+=(--fail-on-warning)
        fi

        # Pass the project as an absolute path, then run the helpers from
        # the action's own directory. -I keeps the caller's environment,
        # working directory and user site off sys.path, so a lib/ or
        # json.py in the caller's workspace is never imported; launch.py
        # puts back only the action's own directory. The helpers report
        # paths relative to the project, so outputs are unchanged.
        case "$INPUT_PATH_PREFIX" in
          /*) project="$INPUT_PATH_PREFIX" ;;
          *) project="$PWD/$INPUT_PATH_PREFIX" ;;
        esac
        args+=(--path-prefix "$project")
        cd "$ACTION_PATH" || exit 1

        report="$("$PYTHON" -I "$ACTION_PATH/lib/launch.py" \
          lib.rtd_audit "${args[@]}")"
        status=$?

        # Surface the report in the job log whatever the outcome.
        printf '%s\n' "$report"

        # Publish the outputs. The helper emits scalar assignments plus a
        # heredoc block for the full report, so a value containing
        # newlines cannot inject further keys.
        printf '%s' "$report" \
          | "$PYTHON" -I "$ACTION_PATH/lib/launch.py" lib.emit_outputs \
          >> "$GITHUB_OUTPUT"

        if [ "$INPUT_SUMMARY" = "true" ]; then
          printf '%s' "$report" \
            | "$PYTHON" -I "$ACTION_PATH/lib/launch.py" lib.render_summary \
            >> "$GITHUB_STEP_SUMMARY"
        fi

        # Repeat findings as workflow annotations so they appear against
        # the run rather than only inside the log.
        printf '%s' "$report" \
          | "$PYTHON" -I "$ACTION_PATH/lib/launch.py" lib.render_annotations

        exit "$status"
