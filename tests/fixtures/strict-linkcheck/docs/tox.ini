[tox]
envlist = docs,docs-linkcheck

[testenv:docs]
basepython = python3.13
commands =
    sphinx-build -W -q -b html . _build/html

[testenv:docs-linkcheck]
basepython = python3.13
commands =
    sphinx-build -W -q -b linkcheck . _build/linkcheck
