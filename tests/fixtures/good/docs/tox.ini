[tox]
envlist = docs,docs-linkcheck
skipsdist = true

[testenv:docs]
basepython = python3.13
deps = -r requirements-docs.txt
commands =
    sphinx-build -W -q -b html -d {envtmpdir}/doctrees . {toxinidir}/_build/html

[testenv:docs-linkcheck]
basepython = python3.13
deps = -r requirements-docs.txt
commands =
    sphinx-build -q -b linkcheck -d {envtmpdir}/doctrees . {toxinidir}/_build/linkcheck
