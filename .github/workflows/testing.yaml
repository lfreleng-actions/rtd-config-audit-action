# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests for the audit logic ###
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the organisation's
      # .github repository and publish it as $CONNECTION_ALLOW_LIST for
      # the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          python3 -m pip install --user --quiet pyyaml
          python3 -m unittest discover -s tests -p "test_*.py" -v

  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A compliant project passes and reports the documentation Python
      # version for a downstream setup-python step.
      - name: "Audit a compliant project"
        id: good
        uses: ./
        with:
          path_prefix: "tests/fixtures/good"

      - name: "Validate the compliant result"
        shell: bash
        env:
          PASSED: ${{ steps.good.outputs.passed }}
          DOCS_PYTHON: ${{ steps.good.outputs.docs_python }}
          BUILD_OS: ${{ steps.good.outputs.build_os }}
          ERRORS: ${{ steps.good.outputs.errors }}
        run: |
          # Validate the compliant result
          fail=0
          if [ "$PASSED" != "true" ]; then
            echo "Expected passed=true, received $PASSED ❌"
            fail=1
          fi
          if [ "$DOCS_PYTHON" != "3.13" ]; then
            echo "Expected docs_python=3.13, received $DOCS_PYTHON ❌"
            fail=1
          fi
          if [ "$BUILD_OS" != "ubuntu-24.04" ]; then
            echo "Expected build_os=ubuntu-24.04, received $BUILD_OS ❌"
            fail=1
          fi
          if [ "$ERRORS" != "0" ]; then
            echo "Expected no errors, received $ERRORS ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Compliant project validated ✅"
          fi
          exit "$fail"

      # A mismatch between tox and ReadTheDocs warns without failing.
      - name: "Audit a project with divergent Python versions"
        id: mismatch
        uses: ./
        with:
          path_prefix: "tests/fixtures/mismatch"

      - name: "Validate the mismatch result"
        shell: bash
        env:
          MISMATCH: ${{ steps.mismatch.outputs.python_mismatch }}
          DOCS_PYTHON: ${{ steps.mismatch.outputs.docs_python }}
        run: |
          # Validate the mismatch result
          fail=0
          if [ "$MISMATCH" != "true" ]; then
            echo "Expected python_mismatch=true, received $MISMATCH ❌"
            fail=1
          fi
          if [ "$DOCS_PYTHON" != "3.13" ]; then
            echo "Expected the tox version 3.13, received $DOCS_PYTHON ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Mismatch detection validated ✅"
          fi
          exit "$fail"

      # Failure testing is also important: retired keys must fail.
      - name: "Audit a legacy project [expected failure]"
        id: legacy
        uses: ./
        continue-on-error: true
        with:
          path_prefix: "tests/fixtures/legacy"

      - name: "Error if the legacy audit did NOT fail"
        if: steps.legacy.outcome == 'success'
        shell: bash
        run: |
          # Error if the legacy audit did NOT fail
          echo "Error: the legacy fixture should have failed the audit ❌"
          exit 1

      # A project with no configuration must fail.
      - name: "Create a project with no configuration"
        shell: bash
        run: |
          # Create a project with no configuration
          mkdir -p "${RUNNER_TEMP}/no-rtd-config"

      - name: "Audit a project with no config [expected failure]"
        id: missing
        uses: ./
        continue-on-error: true
        with:
          path_prefix: "${{ runner.temp }}/no-rtd-config"

      - name: "Error if the missing-config audit did NOT fail"
        if: steps.missing.outcome == 'success'
        shell: bash
        run: |
          # Error if the missing-config audit did NOT fail
          echo "Error: a project with no config should fail the audit ❌"
          exit 1

      # An invalid boolean input must fail.
      - name: "Reject an invalid boolean [expected failure]"
        id: badinput
        uses: ./
        continue-on-error: true
        with:
          path_prefix: "tests/fixtures/good"
          fail_on_warning: "yes-please"

      - name: "Error if the invalid input did NOT fail"
        if: steps.badinput.outcome == 'success'
        shell: bash
        run: |
          # Error if the invalid input did NOT fail
          echo "Error: an invalid boolean should fail the action ❌"
          exit 1

      - name: "Report success"
        shell: bash
        run: |
          # Report success
          echo "All action tests passed ✅"
          echo "All action tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
