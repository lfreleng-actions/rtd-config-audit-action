---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests for the audit logic ###
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the organisation's
      # .github repository and publish it as $CONNECTION_ALLOW_LIST for
      # the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          # Install into a dedicated environment so pip downloads and
          # hash-checks PyYAML. Installing into the runner's Python
          # would let pip skip the download, and the check with it,
          # whenever the image already ships a matching version.
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --quiet \
            -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -p "test_*.py" -v

  ### Test the runtime PyYAML install on a Python that lacks it ###
  runtime-deps:
    name: "Test pinned PyYAML install"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The hosted image's system python3 may ship PyYAML, and then the
      # other job never reaches the install. A setup-python interpreter
      # does not bundle it, which is the common case for callers.
      - name: "Set up a Python without PyYAML"
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: "Confirm PyYAML is absent"
        shell: bash
        run: |
          # Confirm PyYAML is absent
          # Fail rather than pass without exercising the install.
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "Error: PyYAML is already present; the test is void ❌"
            exit 1
          fi
          echo "PyYAML absent, as required ✅"

      - name: "Audit a compliant project"
        id: install
        uses: $/
        with:
          path_prefix: "tests/fixtures/good"

      - name: "Validate the installed PyYAML"
        shell: bash
        env:
          PASSED: ${{ steps.install.outputs.passed }}
        run: |
          # Validate the installed PyYAML
          fail=0
          if [ "$PASSED" != "true" ]; then
            echo "Expected passed=true, received $PASSED ❌"
            fail=1
          fi
          pinned="$(sed -n 's/^pyyaml==\([^ ]*\).*/\1/p' requirements.txt)"
          installed="$(python3 -c 'import yaml; print(yaml.__version__)')"
          if [ -z "$pinned" ] || [ "$installed" != "$pinned" ]; then
            echo "Expected PyYAML $pinned, received $installed ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Installed the pinned PyYAML $installed ✅"
          fi
          exit "$fail"

  ### Test that modules in the caller's workspace are never imported ###
  workspace-modules:
    name: "Ignore modules in the workspace"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Check out below the workspace root, which this repository's own
      # lib/ would otherwise occupy, leaving the root free for the
      # modules planted next.
      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: source

      # A Python without PyYAML, so the action runs its pip install too.
      - name: "Set up a Python without PyYAML"
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # Each planted module records its name in a marker file and exits
      # non-zero, so importing any of them in place of the real module
      # shows up in the marker and breaks the audit.
      - name: "Plant modules in the workspace"
        shell: bash
        run: |
          # Plant modules in the workspace
          set -euo pipefail
          body='import os
          marker = os.path.join(os.environ["RUNNER_TEMP"], "planted-ran")
          with open(marker, "a") as f:
              f.write(__name__ + "\n")
          raise SystemExit(97)
          '
          modules=(yaml json argparse configparser secrets sitecustomize)
          for module in "${modules[@]}"; do
            printf '%s\n' "$body" > "$module.py"
          done
          for package in lib pip; do
            mkdir -p "$package"
            printf '%s\n' "$body" > "$package/__init__.py"
          done
          echo "Planted modules in $PWD ✅"

      # offline_mode skips python-supported-versions-action, so only
      # this action's own Python runs while the planted modules exist.
      - name: "Audit a compliant project"
        id: planted
        uses: $/
        continue-on-error: true
        with:
          path_prefix: "source/tests/fixtures/good"
          offline_mode: "true"

      - name: "Validate the result"
        shell: bash
        env:
          OUTCOME: ${{ steps.planted.outcome }}
          PASSED: ${{ steps.planted.outputs.passed }}
          CONFIG_PATH: ${{ steps.planted.outputs.config_path }}
          DOCS_PYTHON: ${{ steps.planted.outputs.docs_python }}
          BUILD_OS: ${{ steps.planted.outputs.build_os }}
          ERRORS: ${{ steps.planted.outputs.errors }}
        run: |
          # Validate the result
          fail=0
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo "Error: the action imported planted modules ❌"
            cat "$RUNNER_TEMP/planted-ran"
            fail=1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "Expected the audit to succeed, received $OUTCOME ❌"
            fail=1
          fi
          if [ "$PASSED" != "true" ]; then
            echo "Expected passed=true, received $PASSED ❌"
            fail=1
          fi
          if [ "$CONFIG_PATH" != ".readthedocs.yaml" ]; then
            echo "Expected .readthedocs.yaml, received $CONFIG_PATH ❌"
            fail=1
          fi
          if [ "$DOCS_PYTHON" != "3.13" ]; then
            echo "Expected docs_python=3.13, received $DOCS_PYTHON ❌"
            fail=1
          fi
          if [ "$BUILD_OS" != "ubuntu-24.04" ]; then
            echo "Expected build_os=ubuntu-24.04, received $BUILD_OS ❌"
            fail=1
          fi
          if [ "$ERRORS" != "0" ]; then
            echo "Expected no errors, received $ERRORS ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "No planted module was imported ✅"
          fi
          exit "$fail"

  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A compliant project passes and reports the documentation Python
      # version for a downstream setup-python step.
      - name: "Audit a compliant project"
        id: good
        uses: $/
        with:
          path_prefix: "tests/fixtures/good"

      - name: "Validate the compliant result"
        shell: bash
        env:
          PASSED: ${{ steps.good.outputs.passed }}
          DOCS_PYTHON: ${{ steps.good.outputs.docs_python }}
          BUILD_OS: ${{ steps.good.outputs.build_os }}
          RUNNER: ${{ steps.good.outputs.runner }}
          ERRORS: ${{ steps.good.outputs.errors }}
        run: |
          # Validate the compliant result
          fail=0
          if [ "$PASSED" != "true" ]; then
            echo "Expected passed=true, received $PASSED ❌"
            fail=1
          fi
          if [ "$DOCS_PYTHON" != "3.13" ]; then
            echo "Expected docs_python=3.13, received $DOCS_PYTHON ❌"
            fail=1
          fi
          if [ "$BUILD_OS" != "ubuntu-24.04" ]; then
            echo "Expected build_os=ubuntu-24.04, received $BUILD_OS ❌"
            fail=1
          fi
          if [ "$RUNNER" != "ubuntu-24.04" ]; then
            echo "Expected runner=ubuntu-24.04, received $RUNNER ❌"
            fail=1
          fi
          if [ "$ERRORS" != "0" ]; then
            echo "Expected no errors, received $ERRORS ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Compliant project validated ✅"
          fi
          exit "$fail"

      # A mismatch between tox and ReadTheDocs warns without failing.
      - name: "Audit a project with divergent Python versions"
        id: mismatch
        uses: $/
        with:
          path_prefix: "tests/fixtures/mismatch"

      - name: "Validate the mismatch result"
        shell: bash
        env:
          MISMATCH: ${{ steps.mismatch.outputs.python_mismatch }}
          DOCS_PYTHON: ${{ steps.mismatch.outputs.docs_python }}
        run: |
          # Validate the mismatch result
          fail=0
          if [ "$MISMATCH" != "true" ]; then
            echo "Expected python_mismatch=true, received $MISMATCH ❌"
            fail=1
          fi
          if [ "$DOCS_PYTHON" != "3.13" ]; then
            echo "Expected the tox version 3.13, received $DOCS_PYTHON ❌"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Mismatch detection validated ✅"
          fi
          exit "$fail"

      # Failure testing is also important: retired keys must fail.
      - name: "Audit a legacy project [expected failure]"
        id: legacy
        uses: $/
        continue-on-error: true
        with:
          path_prefix: "tests/fixtures/legacy"

      - name: "Error if the legacy audit did NOT fail"
        if: steps.legacy.outcome == 'success'
        shell: bash
        run: |
          # Error if the legacy audit did NOT fail
          echo "Error: the legacy fixture should have failed the audit ❌"
          exit 1

      # A project with no configuration must fail.
      - name: "Create a project with no configuration"
        shell: bash
        run: |
          # Create a project with no configuration
          mkdir -p "${RUNNER_TEMP}/no-rtd-config"

      - name: "Audit a project with no config [expected failure]"
        id: missing
        uses: $/
        continue-on-error: true
        with:
          path_prefix: "${{ runner.temp }}/no-rtd-config"

      - name: "Error if the missing-config audit did NOT fail"
        if: steps.missing.outcome == 'success'
        shell: bash
        run: |
          # Error if the missing-config audit did NOT fail
          echo "Error: a project with no config should fail the audit ❌"
          exit 1

      # An invalid boolean input must fail.
      - name: "Reject an invalid boolean [expected failure]"
        id: badinput
        uses: $/
        continue-on-error: true
        with:
          path_prefix: "tests/fixtures/good"
          fail_on_warning: "yes-please"

      - name: "Error if the invalid input did NOT fail"
        if: steps.badinput.outcome == 'success'
        shell: bash
        run: |
          # Error if the invalid input did NOT fail
          echo "Error: an invalid boolean should fail the action ❌"
          exit 1

      - name: "Report success"
        shell: bash
        run: |
          # Report success
          echo "All action tests passed ✅"
          echo "All action tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
